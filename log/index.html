<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Log - Project 694</title>
<meta name="description" content="Screenshots of my Garmin Connect step totals for each finished day of the Project 694 walk.">
<meta property="og:title" content="Daily log - Project 694">
<meta property="og:description" content="Garmin Connect daily step totals for each finished day.">
<style>
  :root {
    --bg: #fff5f8; --card: #ffffff; --ink: #2a1520; --muted: #7b5b68;
    --pink: #e6337a; --pink-2: #ff7eb0; --track: #f6d7e3;
    --shadow: 0 6px 24px rgba(230, 51, 122, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a0f15; --card: #27171f; --ink: #fbeaf1; --muted: #c39bab; --track: #4a2a38; --shadow: 0 6px 24px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { text-align: center; margin-bottom: 20px; }
  header img { max-width: 70%; height: auto; }
  h1 { margin: 6px 0 4px; font-size: 26px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 auto; font-size: 15px; max-width: 520px; }
  .tabs { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .tab { text-decoration: none; padding: 8px 20px; border-radius: 99px; font-weight: 700; font-size: 15px; color: var(--pink); border: 2px solid var(--pink); transition: background .2s ease, color .2s ease; }
  .tab:hover { background: rgba(230, 51, 122, .1); }
  .tab.active { background: var(--pink); color: #fff; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; font-size: 18px; }
  .card-head .steps { color: var(--pink); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
  .shot { display: block; }
  .shot img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--track); display: block; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
  .btn { display: block; text-align: center; text-decoration: none; font-weight: 700; padding: 13px; border-radius: 14px; font-size: 16px; color: var(--pink); border: 2px solid var(--pink); margin-bottom: 12px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .card { transition: transform .35s ease, box-shadow .35s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(230, 51, 122, .22); }
    .shot img { transition: transform .3s ease; }
    .shot:hover img { transform: scale(1.01); }
  }

  /* Pop-up viewer for the screenshots */
  .shot { cursor: zoom-in; }
  body.lb-open { overflow: hidden; }
  .lb { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 8, 14, .88); opacity: 0; }
  .lb[hidden] { display: none; }
  .lb.show { opacity: 1; }
  .lb-fig { margin: 0; max-width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lb-fig img { max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; border-radius: 12px; background: #fff; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
  .lb-fig figcaption { color: #fff; font-weight: 700; font-size: 15px; text-align: center; }
  .lb-x, .lb-nav { position: absolute; border: 0; cursor: pointer; color: #fff; background: rgba(255, 255, 255, .16); border-radius: 50%; width: 46px; height: 46px; font-size: 30px; line-height: 1; display: grid; place-items: center; }
  .lb-x:hover, .lb-nav:hover { background: rgba(255, 255, 255, .3); }
  .lb-x:focus-visible, .lb-nav:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .lb-nav[hidden] { display: none; }
  .lb-x { top: 14px; right: 14px; }
  .lb-nav { top: 50%; margin-top: -23px; }
  .lb-nav.prev { left: 12px; }
  .lb-nav.next { right: 12px; }
  @media (max-width: 600px) {
    .lb-fig img { max-height: calc(100vh - 190px); }
    .lb-nav { top: auto; bottom: 22px; margin-top: 0; }
    .lb-nav.prev { left: calc(50% - 58px); }
    .lb-nav.next { right: calc(50% - 58px); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .lb { transition: opacity .2s ease; }
    .lb-fig img { transform: scale(.96); transition: transform .25s ease; }
    .lb.show .lb-fig img { transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <a href="../"><img src="../logo.svg" alt="Project 694 logo" width="210"></a>
    <h1>Daily log</h1>
    <p class="sub">A screenshot of my Garmin Connect Steps page for each finished day. Tap one to see it full size.</p>
    <nav class="tabs" aria-label="Pages"><a class="tab" href="../">Live count</a><a class="tab active" href="./" aria-current="page">Daily log</a></nav>
  </header>

  <div id="list"></div>
  <p class="empty hidden" id="empty">The first screenshot appears here once a day is finished.</p>

  <a class="btn hidden" id="garmin" href="#" target="_blank" rel="noopener">View my Garmin Connect profile</a>
  <a class="btn" href="../">Back to the live count</a>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Screenshot viewer">
  <button class="lb-x" id="lb-x" type="button" aria-label="Close">&times;</button>
  <button class="lb-nav prev" id="lb-prev" type="button" aria-label="Earlier day">&#8249;</button>
  <figure class="lb-fig">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-nav next" id="lb-next" type="button" aria-label="Later day">&#8250;</button>
</div>

<script>
(async () => {
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString("en-US");
  const bust = "?t=" + Date.now();
  const get = (url, fallback) => fetch(url + bust).then(r => r.ok ? r.json() : fallback).catch(() => fallback);
  const [cfg, steps, shots] = await Promise.all([
    get("../config.json", {}), get("../data/steps.json", { days: [] }), get("../data/log.json", {})
  ]);
  const byDate = Object.fromEntries((steps.days || []).map(d => [d.date, d.steps]));
  if (cfg.garmin_profile) { $("garmin").href = cfg.garmin_profile; $("garmin").classList.remove("hidden"); }

  const days = Object.keys(shots).sort().reverse();   // newest first
  if (!days.length) { $("empty").classList.remove("hidden"); return; }

  const label = d => new Date(Date.parse(d + "T00:00:00Z")).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
  const items = [];   // same order as the cards: newest first
  for (const d of days) {
    const card = document.createElement("section");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "card-head";
    const h2 = document.createElement("h2");
    h2.textContent = label(d);
    const total = document.createElement("span");
    total.className = "steps";
    total.textContent = byDate[d] !== undefined ? fmt(byDate[d]) + " steps" : "";
    head.append(h2, total);
    const a = document.createElement("a");
    a.className = "shot"; a.href = "../" + shots[d]; a.target = "_blank"; a.rel = "noopener";   // fallback for ctrl/middle click
    const img = document.createElement("img");
    img.src = "../" + shots[d]; img.alt = "Garmin Connect step total for " + label(d); img.loading = "lazy";
    a.appendChild(img);
    const idx = items.length;
    items.push({ src: img.src, alt: img.alt, cap: label(d) + (byDate[d] !== undefined ? " - " + fmt(byDate[d]) + " steps" : "") });
    a.addEventListener("click", e => {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;   // let "open in new tab" work
      e.preventDefault(); openViewer(idx, a);
    });
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = "Screenshot of the Garmin Connect Steps page for this day.";
    card.append(head, a, note);
    $("list").appendChild(card);
  }

  // Pop-up viewer: tap a screenshot to enlarge it over the page
  const lb = $("lb"), lbImg = $("lb-img"), lbCap = $("lb-cap"), lbPrev = $("lb-prev"), lbNext = $("lb-next"), lbX = $("lb-x");
  let cur = -1, opener = null, hideTimer = null;
  function showItem(i) {
    cur = i;
    lbImg.src = items[i].src; lbImg.alt = items[i].alt; lbCap.textContent = items[i].cap;
    lbPrev.hidden = i >= items.length - 1;   // list is newest first, so "earlier" is further down
    lbNext.hidden = i <= 0;
  }
  function openViewer(i, from) {
    clearTimeout(hideTimer);
    opener = from;
    showItem(i);
    lb.hidden = false;
    document.body.classList.add("lb-open");
    setTimeout(() => lb.classList.add("show"), 20);
    lbX.focus();
  }
  function closeViewer() {
    if (cur < 0) return;
    cur = -1;
    lb.classList.remove("show");
    document.body.classList.remove("lb-open");
    hideTimer = setTimeout(() => { lb.hidden = true; lbImg.removeAttribute("src"); }, 220);
    if (opener) opener.focus();
  }
  const step = delta => { const n = cur + delta; if (cur >= 0 && n >= 0 && n < items.length) showItem(n); };
  lbX.addEventListener("click", closeViewer);
  lbPrev.addEventListener("click", () => step(1));
  lbNext.addEventListener("click", () => step(-1));
  lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb-fig")) closeViewer(); });
  document.addEventListener("keydown", e => {
    if (cur < 0) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") step(1);      // earlier day
    else if (e.key === "ArrowRight") step(-1);    // later day
    else if (e.key === "Tab") {                   // keep keyboard focus inside the viewer
      const els = [lbX, lbPrev, lbNext].filter(b => !b.hidden);
      const at = els.indexOf(document.activeElement);
      e.preventDefault();
      els[(at + (e.shiftKey ? els.length - 1 : 1)) % els.length].focus();
    }
  });
  let touchX = null;   // swipe left/right on the image
  lb.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 60) step(dx < 0 ? -1 : 1);
  }, { passive: true });
})();
</script>
</body>
</html>
