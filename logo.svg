<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" role="img" aria-label="Project 694 - breast cancer awareness">
  <defs>
    <!-- number: light pink top, rich rose middle, deep berry bottom -->
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffb3d1"/>
      <stop offset="0.28" stop-color="#ff5f9f"/>
      <stop offset="0.6"  stop-color="#e6337a"/>
      <stop offset="1"    stop-color="#96104a"/>
    </linearGradient>
    <!-- soft glossy highlight over the top of the numbers -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fbd"/>
      <stop offset="1" stop-color="#c8155f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#96104a" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- PROJECT -->
  <g fill="#e6337a">
    <rect x="70" y="76" width="120" height="3" rx="1.5"/>
    <rect x="510" y="76" width="120" height="3" rx="1.5"/>
  </g>
  <text x="350" y="92" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-weight="600" font-size="40" fill="#e6337a"
        textLength="270" lengthAdjust="spacing">PROJECT</text>

  <!-- 694 -->
  <g filter="url(#shadow)">
    <text x="350" y="400" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Impact,sans-serif"
          font-weight="900" font-size="320" fill="url(#num)"
          textLength="580" lengthAdjust="spacingAndGlyphs">694</text>
  </g>
  <text x="350" y="400" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Impact,sans-serif"
        font-weight="900" font-size="320" fill="url(#gloss)"
        textLength="580" lengthAdjust="spacingAndGlyphs">694</text>

  <!-- awareness ribbon -->
  <g transform="translate(350 452) scale(.5) translate(-256 -80)"
     fill="none" stroke="url(#ribbon)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 410 L268 268 C300 200 320 120 268 95 C225 80 195 135 225 200 C232 218 238 240 244 268 L312 410"/>
  </g>
</svg>
