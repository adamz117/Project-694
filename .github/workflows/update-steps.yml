name: Update steps

on:
  schedule:
    - cron: "0 * * * *"   # hourly (GitHub may delay runs by a few minutes)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-steps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch steps from Garmin
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/fetch_steps.py
      - name: Commit if changed
        run: |
          git config user.name "step-bot"
          git config user.email "step-bot@users.noreply.github.com"
          git add data/steps.json
          git diff --staged --quiet || (git commit -m "Update steps" && git push)
